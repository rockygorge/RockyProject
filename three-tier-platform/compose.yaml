services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platformops
      POSTGRES_DB: platformops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U platformops -d platformops"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://platformops:${POSTGRES_PASSWORD}@postgres:5432/platformops
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 15
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    build: ./web
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  pgdata:
