name: PlatformOps Azure infrastructure
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Explicit infrastructure action; AKS incurs cloud charges
        required: true
        default: plan
        options: [plan, apply, destroy]
permissions:
  contents: read
  id-token: write
concurrency:
  group: platformops-dev-infrastructure
  cancel-in-progress: false
jobs:
  infrastructure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: platformops-dev
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_IN_AUTOMATION: "true"
      TF_VAR_prefix: ${{ vars.PLATFORM_PREFIX }}
      TF_VAR_deployer_object_id: ${{ vars.DEPLOYER_OBJECT_ID }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION || 'eastus2' }}
      STATE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      OPERATION: ${{ inputs.operation }}
    defaults:
      run: {working-directory: three-tier-platform/infra}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.9.8, terraform_wrapper: false}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize, validate and plan
        run: |
          terraform init -input=false -backend-config="storage_account_name=$STATE_ACCOUNT" -backend-config="container_name=tfstate" -backend-config="key=platformops-dev.tfstate"
          terraform validate
          if [ "$OPERATION" = destroy ]; then
            terraform plan -input=false -destroy -lock-timeout=5m -out=change.tfplan
          else
            terraform plan -input=false -lock-timeout=5m -out=change.tfplan
          fi
      - name: Apply the plan from this run
        if: inputs.operation != 'plan'
        run: terraform apply -input=false -lock-timeout=5m change.tfplan
      - name: Summarize resource names
        if: inputs.operation == 'apply'
        run: terraform output -json >> "$GITHUB_STEP_SUMMARY"
